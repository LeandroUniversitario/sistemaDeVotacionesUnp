server:
  port: 8080
  error:
    include-message: always   # los 401/403 del filtro JWT llegan con su motivo legible

spring:
  application:
    name: elecciones-backend
  mvc:
    problemdetails:
      enabled: true   # los errores llegan al frontend en el campo "detail"
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/elecciones_unp}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # el esquema lo define base-de-datos/v2 (no dejar que Hibernate lo altere)
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: disabled
      password: disabled

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # A4: sin valor por defecto en el repositorio. Si JWT_SECRET no está definido, en desarrollo se
    # genera una clave aleatoria al arrancar (las sesiones se cierran al reiniciar el backend).
    # En el perfil prod es obligatorio:  export JWT_SECRET="$(openssl rand -base64 48)"
    jwt-secret: ${JWT_SECRET:}
    # El frontend renueva el token mientras la sesión está en uso (POST /api/auth/renovar)
    jwt-expiration: ${JWT_EXPIRATION:PT2H}
  # M8 / A3: límite de peticiones por IP para el login y el portal público
  limites:
    login-por-ip: ${LIMITE_LOGIN_IP:20}           # intentos fallidos por IP cada 15 minutos
    publico-por-ip: ${LIMITE_PUBLICO_IP:120}      # consultas al portal público por IP por minuto
  # CUS18 · carpeta donde el ADMIN genera los respaldos de la base (relativa a la carpeta del backend)
  respaldo:
    directorio: ${RESPALDO_DIR:respaldos}
    # B6: los respaldos se cifran con AES-256-GCM; sin esta clave no se generan
    clave: ${RESPALDO_CLAVE:}
